<!doctype html><meta charset="utf-8"><title>XP25 restart fixture</title>
<style>body{font:18px Tahoma;background:#e7efff;color:#163d76;padding:2rem}</style>
<h1>Supermium profile restart test</h1><p id="result">Running…</p>
<script>
// Fixed fixture data in a newly created engineering profile. No user data read.
const phase=new URL(location.href).searchParams.get('phase');
if(phase==='seed')localStorage.setItem('xp25-restart-proof','fixture-v1');
const ok=localStorage.getItem('xp25-restart-proof')==='fixture-v1';
document.title='XP25 restart '+phase+' '+(ok?'PASS':'FAIL');
document.querySelector('#result').textContent=document.title;
fetch('/browser-result',{method:'POST',body:JSON.stringify({source:location.href,checks:{restart_storage:ok},phase})});
</script>
